*{box-sizing:border-box;margin:0;padding:0}

const A=[1,3,2,3,0,2,3,0,3,3,3]
const T=11,L=['أ','ب','ج','د'];
let c=0,sc=0,pk=false,nm='',log=[];

const go=id=>{document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)};

function startQ(){
  _startTime=Date.now();
  var nm=_uname||'الطالب';
  document.getElementById('sbar').textContent='👤 '+nm;
  c=0;sc=0;pk=false;log=[];
  go('s1');render();
}

function render(){
  pk=false;
  document.getElementById('qc').textContent='السؤال '+(c+1)+' من '+T;
  document.getElementById('ql').textContent='✅ '+sc;
  document.getElementById('pf').style.width=(c/T*100)+'%';
  document.getElementById('qi').innerHTML='<img src="'+I[c]+'" style="max-width:100%;border-radius:8px;display:block;margin:auto" alt=""/>';
  const el=document.getElementById('qo');
  el.innerHTML='';
  for(let i=0;i<4;i++){
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="ol">'+L[i]+'</span>';
    b.onclick=(x=>()=>pick(x))(i);
    el.appendChild(b);
  }
  document.getElementById('bn').style.display='none';
}

function pick(i){
  if(pk)return;pk=true;
  const bs=document.getElementById('qo').querySelectorAll('.opt');
  bs.forEach(b=>b.disabled=true);
  bs[A[c]].classList.add('ok');
  const correct=(i===A[c]);
  if(!correct)bs[i].classList.add('no');
  else sc++;
  log.push({q:c,chosen:i,correct:correct});
  document.getElementById('ql').textContent='✅ '+sc;
  document.getElementById('bn').style.display='inline-flex';
}

function nx(){c++;if(c<T)render();else showRes();}

function showRes(){
  const pct=Math.round(sc/T*100),w=T-sc;
  document.getElementById('rc').textContent=sc;
  document.getElementById('rw').textContent=w;
  document.getElementById('rtl').textContent=T;
  document.getElementById('rp').textContent=pct+'%';
  document.getElementById('rr').style.setProperty('--pct',pct+'%');
  document.getElementById('rname').textContent='👤 '+nm;
  let s,t,b,v;
  if(pct>=90){s='⭐⭐⭐';t='ممتاز! 🌟';b='تفوقت في معظم الأسئلة!';v='<b style="color:var(--gr)">'+sc+'</b> / '+T;}
  else if(pct>=70){s='⭐⭐';t='جيد جداً 👍';b='أداء قوي!';v='<b style="color:var(--t)">'+sc+'</b> / '+T;}
  else if(pct>=50){s='⭐';t='مقبول';b='راجع وأعد.';v='<b style="color:var(--gd)">'+sc+'</b> / '+T;}
  else{s='💪';t='لا تستسلم!';b='راجع وأعد.';v='<b style="color:var(--rd)">'+sc+'</b> / '+T;}
  document.getElementById('rs').textContent=s;
  document.getElementById('rt').textContent=t;
  document.getElementById('rb').textContent=b;
  document.getElementById('rv').innerHTML=v;

  var _dur=Math.round((Date.now()-(_startTime||Date.now()))/1000);
  var _tot=T,_pct2=Math.round(sc/_tot*100);
  var _m=Math.floor(_dur/60),_s2=_dur%60;
  var _sm=document.getElementById('save-msg');
  if(_sm){
    if(!_uid){_sm.textContent='⚠️ لم تُحفظ — سجّل دخولك أولاً';_sm.style.cssText='display:block;background:#2a1e00;color:#f59e0b;padding:.5rem .8rem;border-radius:10px;text-align:center;font-size:.85rem;font-weight:700;margin:.5rem 0';}
    else{_sm.style.cssText='display:block;background:#1e1e32;color:#94a3b8;padding:.5rem .8rem;border-radius:10px;text-align:center;font-size:.85rem;margin:.5rem 0';_sm.textContent='⏳ جارِ حفظ نتيجتك...';
      _SB.from('results').insert([{user_id:_uid,subject:_subj,section_num:107,correct:sc,total:_tot,duration_sec:_dur,score_pct:_pct2}]).then(function(r){
        if(!r.error){_sm.textContent='✅ نتيجتك '+sc+'/'+_tot+' ('+_pct2+'%) حُفظت في حسابك';_sm.style.background='#052e16';_sm.style.color='#22c55e';}
        else{_sm.textContent='❌ خطأ في الحفظ';_sm.style.background='#2d0707';_sm.style.color='#ef4444';}
      });
    }
  }
  go('s2');
  showRev('all');
}

function showRev(filter){
  ['all','ok','no'].forEach(f=>{
    const el=document.getElementById('tab-'+f);
    el.className='rtab'+(filter===f?' act-'+f:'');
  });
  const list=document.getElementById('rev-list');
  list.innerHTML='';
  const items=log.filter(e=>filter==='all'||(filter==='ok'&&e.correct)||(filter==='no'&&!e.correct));
  if(!items.length){
    list.innerHTML='<p style="text-align:center;color:var(--mt);padding:1rem">لا توجد أسئلة</p>';
    return;
  }
  items.forEach(function(entry){
    const q=entry.q,chosen=entry.chosen,correct=entry.correct;
    const card=document.createElement('div');
    card.className='rev-card '+(correct?'is-ok':'is-no');
    const hdr=document.createElement('div');
    hdr.className='rev-hdr '+(correct?'ok':'no');
    hdr.textContent=(correct?'✅ صحيح':'❌ خاطئ')+' — السؤال '+(q+1);
    card.appendChild(hdr);
    const imgDiv=document.createElement('div');
    imgDiv.className='rev-img';
    imgDiv.innerHTML='<img src="'+I[q]+'" style="max-width:100%;border-radius:6px;display:block;margin:auto" alt=""/>';
    card.appendChild(imgDiv);
    const ansDiv=document.createElement('div');
    ansDiv.className='rev-ans';
    for(let i=0;i<4;i++){
      const span=document.createElement('span');
      let cls='dim';
      if(i===A[q])cls='ok';
      else if(i===chosen&&!correct)cls='no';
      span.className='rans '+cls;
      let label=L[i];
      if(i===A[q])label+=' ✓';
      if(i===chosen&&!correct)label+=' ✗';
      span.textContent=label;
      ansDiv.appendChild(span);
    }
    card.appendChild(ansDiv);
    list.appendChild(card);
  });
}

function rst(){c=0;sc=0;pk=false;log=[];go('s1');render();}
</script>
