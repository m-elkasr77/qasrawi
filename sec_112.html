*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f1a;--s:#181828;--s2:#1e1e32;--bd:#2a2a48;--p:#7c3aed;--pl:#a855f7;--t:#06b6d4;--tx:#e2e8f0;--mt:#94a3b8;--gr:#22c55e;--g2:#052e16;--rd:#ef4444;--r2:#2d0707;--gd:#f59e0b}
html,body{background:var(--bg);font-family:'Tajawal',sans-serif;color:var(--tx);min-height:100vh}
body{display:flex;align-items:flex-start;justify-content:center;padding:1rem 1rem 4rem}
.sc{display:none;width:100%;max-width:700px;animation:fu .3s ease}
.sc.on{display:flex;flex-direction:column;align-items:center}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--s);border:1px solid var(--bd);border-radius:20px;padding:1.8rem 1.5rem;width:100%;box-shadow:0 10px 40px #00000060}

.grad{background:linear-gradient(135deg,#a855f7,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:var(--mt);text-align:center;margin-top:.4rem;font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.75rem 1.6rem;border-radius:12px;font-family:inherit;font-size:.94rem;font-weight:700;cursor:pointer;border:none;transition:transform .13s,box-shadow .13s;width:100%;margin-top:.6rem}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px #7c3aed44}
.bp{background:linear-gradient(135deg,var(--p),var(--t));color:#fff;margin-top:1.3rem}
.bg{background:var(--s2);color:var(--mt);border:1px solid var(--bd)}
.bsm{width:auto;margin-top:0;padding:.58rem 1.3rem;font-size:.86rem}
.nr{display:flex;gap:.5rem;margin-bottom:.8rem;justify-content:space-between;flex-wrap:wrap}
.nb{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:.38rem .8rem;font-family:inherit;font-size:.8rem;font-weight:700;color:var(--mt);text-decoration:none;transition:.13s}
.nb:hover{border-color:var(--pl);color:var(--pl)}
.ir{display:flex;gap:.65rem;margin-top:1.1rem}
.ib{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:.8rem;text-align:center}
.ib .n{font-size:1.3rem;font-weight:800;color:var(--t)}
.ib .l{font-size:.72rem;color:var(--mt);margin-top:.12rem}
.name-wrap{margin:1.2rem 0 .4rem;text-align:right}

.name-inp{width:100%;background:var(--s2);border:2px solid var(--bd);border-radius:12px;padding:.75rem 1rem;font-family:inherit;font-size:1rem;color:var(--tx);outline:none;transition:border-color .15s;text-align:right}
.name-inp:focus{border-color:var(--pl)}
.name-inp::placeholder{color:var(--mt)}
.sbar{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:.45rem .9rem;font-size:.82rem;font-weight:700;color:var(--pl);margin-bottom:.8rem;text-align:center}
.pw{width:100%;margin-bottom:1rem}
.pi{display:flex;justify-content:space-between;font-size:.77rem;color:var(--mt);margin-bottom:.38rem}

.qi{border-radius:14px;padding:.4rem;margin-bottom:.9rem;text-align:center;background:#fff}
.qi img{max-width:100%;border-radius:8px;display:block;margin:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

.opt{background:var(--s2);border:2px solid var(--bd);border-radius:12px;padding:.72rem .8rem;font-family:inherit;font-size:.9rem;font-weight:500;color:var(--tx);cursor:pointer;text-align:center;transition:.14s;min-height:52px;display:flex;align-items:center;justify-content:center}
.opt:hover:not(:disabled){border-color:var(--pl);background:#1a1030;transform:scale(1.015)}
.opt:disabled{cursor:default;transform:none!important}
.opt.ok{background:var(--g2)!important;border-color:var(--gr)!important;color:var(--gr)!important;font-weight:700}
.opt.no{background:var(--r2)!important;border-color:var(--rd)!important;color:var(--rd)!important}
.ol{color:var(--pl);font-weight:800;font-size:1rem;margin-left:.3rem}
.qf{display:flex;justify-content:flex-start;margin-top:.85rem}

.ri{position:relative;text-align:center}
.rp{font-size:1.35rem;font-weight:800}
.rl{font-size:.65rem;color:var(--mt)}
.sr{display:flex;gap:.7rem;margin:.9rem 0}
.sb{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:.8rem;text-align:center}
.sb .n{font-size:1.35rem;font-weight:800}
.sb .l{font-size:.72rem;color:var(--mt);margin-top:.12rem}
.sc2 .n{color:var(--gr)}.sw .n{color:var(--rd)}.st .n{color:var(--t)}
.vd{text-align:center;font-size:.88rem;color:var(--mt);margin-bottom:.3rem}
.stars{text-align:center;font-size:1.7rem;margin-bottom:.3rem}
.rev-title{font-size:1rem;font-weight:700;margin:1.2rem 0 .7rem;text-align:center}
.rev-tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.rtab{flex:1;padding:.5rem;border-radius:10px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;border:2px solid var(--bd);background:var(--s2);color:var(--mt);transition:.15s}
.rtab.act-ok{border-color:var(--gr);color:var(--gr);background:#052e16}
.rtab.act-no{border-color:var(--rd);color:var(--rd);background:#2d0707}
.rtab.act-all{border-color:var(--pl);color:var(--pl);background:#1a1030}
.rev-list{display:flex;flex-direction:column;gap:1rem}
.rev-card{background:var(--s2);border:2px solid var(--bd);border-radius:14px;overflow:hidden}
.rev-card.is-ok{border-color:var(--gr)}
.rev-card.is-no{border-color:var(--rd)}
.rev-hdr{display:flex;align-items:center;padding:.55rem .9rem;font-size:.82rem;font-weight:700}
.rev-hdr.ok{background:var(--g2);color:var(--gr)}
.rev-hdr.no{background:var(--r2);color:var(--rd)}
.rev-img{padding:.5rem;text-align:center;background:#fff;border-radius:8px;margin:.5rem}

.rans{padding:.3rem .7rem;border-radius:8px;font-size:.82rem;font-weight:700;border:1.5px solid transparent}

.rans.no{background:var(--r2);border-color:var(--rd);color:var(--rd)}

const A=[3,1,0,0,1,1,2,2,3,2,0]
const T=11,L=['أ','ب','ج','د'];
let c=0,sc=0,pk=false,nm='',log=[];

const go=id=>{document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)};

function startQ(){
  _startTime=Date.now();
  var nm=_uname||'الطالب';
  document.getElementById('sbar').textContent='👤 '+nm;
  c=0;sc=0;pk=false;log=[];
  go('s1');render();
}

function render(){
  pk=false;
  document.getElementById('qc').textContent='السؤال '+(c+1)+' من '+T;
  document.getElementById('ql').textContent='✅ '+sc;
  document.getElementById('pf').style.width=(c/T*100)+'%';
  document.getElementById('qi').innerHTML='<img src="'+I[c]+'" style="max-width:100%;border-radius:8px;display:block;margin:auto" alt=""/>';
  const el=document.getElementById('qo');
  el.innerHTML='';
  for(let i=0;i<4;i++){
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="ol">'+L[i]+'</span>';
    b.onclick=(x=>()=>pick(x))(i);
    el.appendChild(b);
  }
  document.getElementById('bn').style.display='none';
}

function pick(i){
  if(pk)return;pk=true;
  const bs=document.getElementById('qo').querySelectorAll('.opt');
  bs.forEach(b=>b.disabled=true);
  bs[A[c]].classList.add('ok');
  const correct=(i===A[c]);
  if(!correct)bs[i].classList.add('no');
  else sc++;
  log.push({q:c,chosen:i,correct:correct});
  document.getElementById('ql').textContent='✅ '+sc;
  document.getElementById('bn').style.display='inline-flex';
}

function nx(){c++;if(c<T)render();else showRes();}

function showRes(){
  const pct=Math.round(sc/T*100),w=T-sc;
  document.getElementById('rc').textContent=sc;
  document.getElementById('rw').textContent=w;
  document.getElementById('rtl').textContent=T;
  document.getElementById('rp').textContent=pct+'%';
  document.getElementById('rr').style.setProperty('--pct',pct+'%');
  document.getElementById('rname').textContent='👤 '+nm;
  let s,t,b,v;
  if(pct>=90){s='⭐⭐⭐';t='ممتاز! 🌟';b='تفوقت في معظم الأسئلة!';v='<b style="color:var(--gr)">'+sc+'</b> / '+T;}
  else if(pct>=70){s='⭐⭐';t='جيد جداً 👍';b='أداء قوي!';v='<b style="color:var(--t)">'+sc+'</b> / '+T;}
  else if(pct>=50){s='⭐';t='مقبول';b='راجع وأعد.';v='<b style="color:var(--gd)">'+sc+'</b> / '+T;}
  else{s='💪';t='لا تستسلم!';b='راجع وأعد.';v='<b style="color:var(--rd)">'+sc+'</b> / '+T;}
  document.getElementById('rs').textContent=s;
  document.getElementById('rt').textContent=t;
  document.getElementById('rb').textContent=b;
  document.getElementById('rv').innerHTML=v;

  var _dur=Math.round((Date.now()-(_startTime||Date.now()))/1000);
  var _tot=T,_pct2=Math.round(sc/_tot*100);
  var _m=Math.floor(_dur/60),_s2=_dur%60;
  var _sm=document.getElementById('save-msg');
  if(_sm){
    if(!_uid){_sm.textContent='⚠️ لم تُحفظ — سجّل دخولك أولاً';_sm.style.cssText='display:block;background:#2a1e00;color:#f59e0b;padding:.5rem .8rem;border-radius:10px;text-align:center;font-size:.85rem;font-weight:700;margin:.5rem 0';}
    else{_sm.style.cssText='display:block;background:#1e1e32;color:#94a3b8;padding:.5rem .8rem;border-radius:10px;text-align:center;font-size:.85rem;margin:.5rem 0';_sm.textContent='⏳ جارِ حفظ نتيجتك...';
      _SB.from('results').insert([{user_id:_uid,subject:_subj,section_num:112,correct:sc,total:_tot,duration_sec:_dur,score_pct:_pct2}]).then(function(r){
        if(!r.error){_sm.textContent='✅ نتيجتك '+sc+'/'+_tot+' ('+_pct2+'%) حُفظت في حسابك';_sm.style.background='#052e16';_sm.style.color='#22c55e';}
        else{_sm.textContent='❌ خطأ في الحفظ';_sm.style.background='#2d0707';_sm.style.color='#ef4444';}
      });
    }
  }
  go('s2');
  showRev('all');
}

function showRev(filter){
  ['all','ok','no'].forEach(f=>{
    const el=document.getElementById('tab-'+f);
    el.className='rtab'+(filter===f?' act-'+f:'');
  });
  const list=document.getElementById('rev-list');
  list.innerHTML='';
  const items=log.filter(e=>filter==='all'||(filter==='ok'&&e.correct)||(filter==='no'&&!e.correct));
  if(!items.length){
    list.innerHTML='<p style="text-align:center;color:var(--mt);padding:1rem">لا توجد أسئلة</p>';
    return;
  }
  items.forEach(function(entry){
    const q=entry.q,chosen=entry.chosen,correct=entry.correct;
    const card=document.createElement('div');
    card.className='rev-card '+(correct?'is-ok':'is-no');
    const hdr=document.createElement('div');
    hdr.className='rev-hdr '+(correct?'ok':'no');
    hdr.textContent=(correct?'✅ صحيح':'❌ خاطئ')+' — السؤال '+(q+1);
    card.appendChild(hdr);
    const imgDiv=document.createElement('div');
    imgDiv.className='rev-img';
    imgDiv.innerHTML='<img src="'+I[q]+'" style="max-width:100%;border-radius:6px;display:block;margin:auto" alt=""/>';
    card.appendChild(imgDiv);
    const ansDiv=document.createElement('div');
    ansDiv.className='rev-ans';
    for(let i=0;i<4;i++){
      const span=document.createElement('span');
      let cls='dim';
      if(i===A[q])cls='ok';
      else if(i===chosen&&!correct)cls='no';
      span.className='rans '+cls;
      let label=L[i];
      if(i===A[q])label+=' ✓';
      if(i===chosen&&!correct)label+=' ✗';
      span.textContent=label;
      ansDiv.appendChild(span);
    }
    card.appendChild(ansDiv);
    list.appendChild(card);
  });
}

function rst(){c=0;sc=0;pk=false;log=[];go('s1');render();}
</script>
