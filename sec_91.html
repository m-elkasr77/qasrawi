*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f1a;--s:#181828;--s2:#1e1e32;--bd:#2a2a48;--p:#7c3aed;--pl:#a855f7;--t:#06b6d4;--tx:#e2e8f0;--mt:#94a3b8;--gr:#22c55e;--g2:#052e16;--rd:#ef4444;--r2:#2d0707}

.rev-title{font-size:1rem;font-weight:700;margin:1.2rem 0 .7rem;text-align:center}

const T=11,L=['أ','ب','ج','د'];
let c=0,sc=0,pk=false,log=[];
const go=id=>{document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)};
function startQ(){_st=Date.now();document.getElementById('sbar').textContent='👤 '+(_uname||'الطالب');document.getElementById('rname').textContent='👤 '+(_uname||'الطالب');c=0;sc=0;pk=false;log=[];go('s1');render();}
function render(){
  pk=false;const q=QS[c];
  document.getElementById('qc').textContent='السؤال '+(c+1)+' من '+T;
  document.getElementById('ql').textContent='✅ '+sc;
  document.getElementById('pf').style.width=(c/T*100)+'%';
  const qt=document.getElementById('qt');if(q.text){qt.textContent=q.text;qt.style.display='block';}else qt.style.display='none';
  const qi=document.getElementById('qi');if(q.img){qi.innerHTML='<img src="'+q.img+'" style="max-width:100%;display:block;margin:auto;border-radius:6px" alt=""/>';qi.style.display='block';}else qi.style.display='none';
  const el=document.getElementById('qo');el.innerHTML='';
  for(let i=0;i<4;i++){const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="ol">'+L[i]+'</span><span>'+q.opts[i]+'</span>';b.onclick=(x=>()=>pick(x))(i);el.appendChild(b);}
  document.getElementById('bn').style.display='none';
}
function pick(i){if(pk)return;pk=true;const q=QS[c];const bs=document.getElementById('qo').querySelectorAll('.opt');bs.forEach(b=>b.disabled=true);bs[q.ans].classList.add('ok');if(i!==q.ans)bs[i].classList.add('no');else sc++;log.push({q:c,ch:i,ok:i===q.ans});document.getElementById('ql').textContent='✅ '+sc;document.getElementById('bn').style.display='inline-flex';}
function nx(){c++;if(c<T)render();else showRes();}
function showRes(){
  const pct=Math.round(sc/T*100);
  document.getElementById('rc').textContent=sc;document.getElementById('rw').textContent=T-sc;document.getElementById('rtl').textContent=T;
  document.getElementById('rp').textContent=pct+'%';document.getElementById('rr').style.setProperty('--pct',pct+'%');
  document.getElementById('rs').textContent=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('rt').textContent=pct>=90?'ممتاز! 🌟':pct>=70?'جيد جداً 👍':pct>=50?'مقبول':'لا تستسلم! 💪';
  document.getElementById('rb').textContent='القسم 91 — '+sc+'/'+T+' صحيحة';
  const dur=Math.round((Date.now()-(_st||Date.now()))/1000);
  document.getElementById('rv').textContent='⏱ الوقت: '+Math.floor(dur/60)+'د '+(dur%60)+'ث';
  const sm=document.getElementById('sm');
  if(_uid){
    sm.style.cssText='display:block;background:#1e1e32;color:#94a3b8;padding:.5rem .8rem;border-radius:10px;text-align:center;font-size:.85rem;margin:.5rem 0';
    sm.textContent='⏳ جارٍ حفظ نتيجتك...';
    // حفظ النتيجة الإجمالية
    _SB.from('results').insert([{user_id:_uid,subject:_subj,section_num:91,correct:sc,total:T,duration_sec:dur,score_pct:pct}]).then(r=>{
      if(!r.error){
        sm.textContent='✅ نتيجتك '+sc+'/'+T+' ('+pct+'%) حُفظت في حسابك';
        sm.style.background='#052e16';sm.style.color='#22c55e';
      }else{sm.textContent='❌ خطأ في الحفظ';sm.style.background='#2d0707';sm.style.color='#ef4444';}
    });
    // حفظ تفاصيل كل سؤال
    const details=log.map(e=>({
      user_id:_uid,subject:_subj,section_num:91,
      question_index:e.q,is_correct:e.ok,
      chosen:e.ch,correct_answer:QS[e.q].ans
    }));
    _SB.from('result_details').insert(details);
  }else{
    sm.textContent='⚠️ لم تُحفظ — سجّل دخولك أولاً';
    sm.style.cssText='display:block;background:#2a1e00;color:#f59e0b;padding:.5rem .8rem;border-radius:10px;text-align:center;font-size:.85rem;font-weight:700;margin:.5rem 0';
  }
  go('s2');rev('all');
}

// ── توليد PDF المحلول ──
async function dlPDF(){
  const btn=document.getElementById('pdf-btn');
  btn.textContent='⏳ جارٍ التوليد...';btn.disabled=true;
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210,margin=15,lineH=8;
  let y=margin;

  // دالة إضافة نص عربي
  function addText(text,x,yPos,size,align){
    pdf.setFontSize(size||12);
    pdf.text(text,x,yPos,{align:align||'right'});
  }

  // رأس الصفحة
  pdf.setFillColor(15,15,26);pdf.rect(0,0,W,20,'F');
  pdf.setTextColor(255,255,255);
  addText('القسم 91 — قدرات كمي',W-margin,13,14,'right');
  addText('الطالب: '+(_uname||'—'),margin+60,13,11,'left');
  pdf.setTextColor(0,0,0);
  y=28;

  for(let i=0;i<log.length;i++){
    const e=log[i];const q=QS[e.q];
    if(y>260){pdf.addPage();y=margin;}

    // رقم السؤال + نتيجة
    const clr=e.ok?[5,46,22]:[45,7,7];
    pdf.setFillColor(...clr);
    pdf.roundedRect(margin,y,W-2*margin,7,2,2,'F');
    pdf.setTextColor(e.ok?34:239,e.ok?197:68,e.ok?94:68);
    addText((e.ok?'✓ صحيح':'✗ خاطئ')+' — السؤال '+(e.q+1),W-margin-2,y+5,10,'right');
    pdf.setTextColor(150,150,180);
    addText('الإجابة الصحيحة: '+L[q.ans],margin+2,y+5,9,'left');
    if(!e.ok){addText('اخترت: '+L[e.ch],margin+50,y+5,9,'left');}
    pdf.setTextColor(0,0,0);
    y+=10;

    // صورة السؤال
    if(q.img){
      try{
        const img=new Image();
        await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=q.img;});
        const maxW=W-2*margin,maxH=55;
        let iW=img.naturalWidth,iH=img.naturalHeight;
        let ratio=Math.min(maxW/iW,maxH/iH);
        const dW=iW*ratio,dH=iH*ratio;
        const xOff=(W-dW)/2;
        if(y+dH>270){pdf.addPage();y=margin;}
        pdf.setFillColor(255,255,255);pdf.rect(xOff-2,y-1,dW+4,dH+2,'F');
        pdf.addImage(q.img,'JPEG',xOff,y,dW,dH);
        y+=dH+4;
      }catch(err){y+=3;}
    }

    // نص السؤال
    if(q.text){
      pdf.setFontSize(10);pdf.setTextColor(30,30,50);
      const lines=pdf.splitTextToSize(q.text,W-2*margin);
      lines.forEach(ln=>{
        if(y>270){pdf.addPage();y=margin;}
        pdf.text(ln,W-margin,y,{align:'right'});y+=lineH-2;
      });
      y+=2;
    }

    // خط فاصل
    if(y<265){pdf.setDrawColor(42,42,72);pdf.setLineWidth(0.3);pdf.line(margin,y,W-margin,y);y+=5;}
  }

  // تذييل
  const pages=pdf.internal.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    pdf.setPage(p);pdf.setFontSize(8);pdf.setTextColor(100,100,120);
    pdf.text('صفحة '+p+' من '+pages,W/2,290,{align:'center'});
    pdf.text('منصة القصراوي',margin,290);
  }

  pdf.save('القسم_91_محلول.pdf');
  btn.textContent='📄 تحميل PDF المحلول';btn.disabled=false;
}
function rev(f){
  ['all','ok','no'].forEach(x=>document.getElementById('t'+x).className='rtab'+(f===x?' act-'+x:''));
  const rl=document.getElementById('rl');rl.innerHTML='';
  const items=log.filter(e=>f==='all'||(f==='ok'&&e.ok)||(f==='no'&&!e.ok));
  if(!items.length){rl.innerHTML='<p style="text-align:center;color:var(--mt);padding:1rem">لا توجد أسئلة</p>';return;}
  items.forEach(e=>{
    const q=QS[e.q];const card=document.createElement('div');card.className='rev-card '+(e.ok?'is-ok':'is-no');
    const hdr=document.createElement('div');hdr.className='rev-hdr '+(e.ok?'ok':'no');hdr.textContent=(e.ok?'✅ صحيح':'❌ خاطئ')+' — السؤال '+(e.q+1);card.appendChild(hdr);
    const body=document.createElement('div');body.className='rev-body';
    if(q.img){const d=document.createElement('div');d.className='rev-img';d.innerHTML='<img src="'+q.img+'" alt=""/>';body.appendChild(d);}
    if(q.text){const p=document.createElement('div');p.className='rev-qt';p.textContent=q.text;body.appendChild(p);}
    const od=document.createElement('div');od.className='rev-opts';
    q.opts.forEach((o,i)=>{const s=document.createElement('span');s.className='rans'+(i===q.ans?' ok':i===e.ch&&!e.ok?' no':'');s.textContent=L[i]+' '+o;od.appendChild(s);});
    body.appendChild(od);card.appendChild(body);rl.appendChild(card);
  });
}
function rst(){c=0;sc=0;pk=false;log=[];go('s0');}
</script>
