<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f1a;--s:#181828;--s2:#1e1e32;--bd:#2a2a48;--p:#7c3aed;--pl:#a855f7;--t:#06b6d4;--tx:#e2e8f0;--mt:#94a3b8;--gr:#22c55e;--g2:#052e16;--rd:#ef4444;--r2:#2d0707}
html,body{background:var(--bg);font-family:'Tajawal',sans-serif;color:var(--tx);min-height:100vh}
body{display:flex;align-items:flex-start;justify-content:center;padding:1rem 1rem 4rem}
.sc{display:none;width:100%;max-width:700px;animation:fu .3s ease}.sc.on{display:flex;flex-direction:column;align-items:center}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--s);border:1px solid var(--bd);border-radius:20px;padding:1.8rem 1.5rem;width:100%;box-shadow:0 10px 40px #00000060}
.bdg{display:inline-flex;background:linear-gradient(135deg,var(--p),var(--t));border-radius:50px;padding:.38rem .95rem;font-size:.78rem;font-weight:700;color:#fff;margin-bottom:1.1rem}
h1{font-size:1.7rem;font-weight:800;text-align:center}
.grad{background:linear-gradient(135deg,#a855f7,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:var(--mt);text-align:center;margin-top:.4rem;font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.75rem 1.6rem;border-radius:12px;font-family:inherit;font-size:.94rem;font-weight:700;cursor:pointer;border:none;transition:transform .13s;width:100%;margin-top:.6rem;text-decoration:none}
.btn:hover{transform:translateY(-2px)}.bp{background:linear-gradient(135deg,var(--p),var(--t));color:#fff;margin-top:1.3rem}
.bg{background:var(--s2);color:var(--mt);border:1px solid var(--bd)}.bsm{width:auto;margin-top:0;padding:.58rem 1.3rem;font-size:.86rem}
.nr{display:flex;gap:.5rem;margin-bottom:.8rem;justify-content:space-between}
.nb{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:.38rem .8rem;font-family:inherit;font-size:.8rem;font-weight:700;color:var(--mt);text-decoration:none}
.nb:hover{border-color:var(--pl);color:var(--pl)}
.ir{display:flex;gap:.65rem;margin-top:1.1rem}.ib{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:.8rem;text-align:center}
.ib .n{font-size:1.3rem;font-weight:800;color:var(--t)}.ib .l{font-size:.72rem;color:var(--mt);margin-top:.12rem}
.uchip{display:none;align-items:center;gap:.5rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:.28rem .85rem .28rem .45rem;font-size:.82rem;font-weight:700;margin-bottom:.8rem}
.uav{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff;flex-shrink:0}
.gw{display:none;background:#2a1e00;border:1px solid #f59e0b;color:#f59e0b;border-radius:10px;padding:.5rem .9rem;font-size:.82rem;margin-bottom:.8rem;text-align:center}
.sbar{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:.45rem .9rem;font-size:.82rem;font-weight:700;color:var(--pl);margin-bottom:.8rem;text-align:center}
.pw{width:100%;margin-bottom:1rem}.pi{display:flex;justify-content:space-between;font-size:.77rem;color:var(--mt);margin-bottom:.38rem}
.pb{height:6px;background:var(--s2);border-radius:99px;overflow:hidden}.pf{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--t));transition:width .4s}
.qt{font-size:1rem;font-weight:700;color:var(--tx);margin-bottom:.75rem;direction:rtl;line-height:1.65;text-align:center;display:none}
.qi{margin-bottom:.8rem;text-align:center;background:#fff;border-radius:12px;padding:.7rem;display:none}.qi img{max-width:100%;display:block;margin:auto;border-radius:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:440px){.opts{grid-template-columns:1fr}}
.opt{background:var(--s2);border:2px solid var(--bd);border-radius:12px;padding:.9rem .8rem;font-family:inherit;font-size:1.4rem;font-weight:800;color:var(--pl);cursor:pointer;text-align:center;transition:.14s;min-height:70px;display:flex;align-items:center;justify-content:center}
.opt:hover:not(:disabled){border-color:var(--pl);background:#1a1030;transform:scale(1.015)}.opt:disabled{cursor:default;transform:none!important}
.opt.ok{background:var(--g2)!important;border-color:var(--gr)!important;color:var(--gr)!important;font-weight:700}.opt.no{background:var(--r2)!important;border-color:var(--rd)!important;color:var(--rd)!important}
.ol{color:var(--pl);font-weight:800;font-size:1rem;flex-shrink:0}
.qf{display:flex;justify-content:flex-start;margin-top:.85rem}
.ring{width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--t) 0%,var(--p) var(--pct,0%),var(--s2) var(--pct,0%));display:flex;align-items:center;justify-content:center;margin:.9rem auto;position:relative}
.ring::before{content:'';position:absolute;inset:10px;background:var(--s);border-radius:50%}
.ri{position:relative;text-align:center}.rp{font-size:1.35rem;font-weight:800}.rl{font-size:.65rem;color:var(--mt)}
.sr{display:flex;gap:.7rem;margin:.9rem 0}.sb{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:.8rem;text-align:center}
.sb .n{font-size:1.35rem;font-weight:800}.sb .l{font-size:.72rem;color:var(--mt);margin-top:.12rem}
.sc2 .n{color:var(--gr)}.sw .n{color:var(--rd)}.st .n{color:var(--t)}
.vd{text-align:center;font-size:.88rem;color:var(--mt);margin-bottom:.3rem}.stars{text-align:center;font-size:1.7rem;margin-bottom:.3rem}
.save-msg{display:none;padding:.5rem .8rem;border-radius:10px;text-align:center;font-size:.85rem;font-weight:700;margin:.5rem 0}
.rev-title{font-size:1rem;font-weight:700;margin:1.2rem 0 .7rem;text-align:center}
.rev-tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.rtab{flex:1;padding:.5rem;border-radius:10px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;border:2px solid var(--bd);background:var(--s2);color:var(--mt)}
.rtab.act-ok{border-color:var(--gr);color:var(--gr);background:#052e16}.rtab.act-no{border-color:var(--rd);color:var(--rd);background:#2d0707}.rtab.act-all{border-color:var(--pl);color:var(--pl);background:#1a1030}
.rev-list{display:flex;flex-direction:column;gap:1rem}.rev-card{background:var(--s2);border:2px solid var(--bd);border-radius:14px;overflow:hidden}
.rev-card.is-ok{border-color:var(--gr)}.rev-card.is-no{border-color:var(--rd)}
.rev-hdr{padding:.55rem .9rem;font-size:.82rem;font-weight:700}
.rev-hdr.ok{background:var(--g2);color:var(--gr)}.rev-hdr.no{background:var(--r2);color:var(--rd)}
.rev-body{padding:.7rem .9rem}
.rev-qt{font-size:.92rem;font-weight:700;margin-bottom:.5rem;color:var(--tx)}
.rev-img{background:#fff;border-radius:8px;padding:.5rem;margin-bottom:.5rem}.rev-img img{max-width:100%;display:block;margin:auto;border-radius:4px}
.rev-opts{display:flex;flex-wrap:wrap;gap:.4rem}
.rans{padding:.25rem .65rem;border-radius:8px;font-size:.82rem;font-weight:700;border:1.5px solid var(--bd);background:var(--s);color:var(--mt)}
.rans.ok{background:var(--g2);border-color:var(--gr);color:var(--gr)}.rans.no{background:var(--r2);border-color:var(--rd);color:var(--rd)}
</style>

const T=11,L=['أ','ب','ج','د'];
let c=0,sc=0,pk=false,log=[];
const go=id=>{document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)};
function startQ(){_st=Date.now();document.getElementById('sbar').textContent='👤 '+(_uname||'الطالب');document.getElementById('rname').textContent='👤 '+(_uname||'الطالب');c=0;sc=0;pk=false;log=[];go('s1');render();}
function render(){
  pk=false;const q=QS[c];
  document.getElementById('qc').textContent='السؤال '+(c+1)+' من '+T;
  document.getElementById('ql').textContent='✅ '+sc;
  document.getElementById('pf').style.width=(c/T*100)+'%';
  const qt=document.getElementById('qt');if(q.text){qt.textContent=q.text;qt.style.display='block';}else qt.style.display='none';
  const qi=document.getElementById('qi');if(q.img){qi.innerHTML='<img src="'+q.img+'" style="max-width:100%;display:block;margin:auto;border-radius:6px" alt=""/>';qi.style.display='block';}else qi.style.display='none';
  const el=document.getElementById('qo');el.innerHTML='';
  for(let i=0;i<4;i++){const b=document.createElement('button');b.className='opt';b.textContent=L[i];b.onclick=(x=>()=>pick(x))(i);el.appendChild(b);}
  document.getElementById('bn').style.display='none';
}
function pick(i){if(pk)return;pk=true;const q=QS[c];const bs=document.getElementById('qo').querySelectorAll('.opt');bs.forEach(b=>b.disabled=true);bs[q.ans].classList.add('ok');if(i!==q.ans)bs[i].classList.add('no');else sc++;log.push({q:c,ch:i,ok:i===q.ans});document.getElementById('ql').textContent='✅ '+sc;document.getElementById('bn').style.display='inline-flex';}
function nx(){c++;if(c<T)render();else showRes();}
function showRes(){
  const pct=Math.round(sc/T*100);
  document.getElementById('rc').textContent=sc;document.getElementById('rw').textContent=T-sc;document.getElementById('rtl').textContent=T;
  document.getElementById('rp').textContent=pct+'%';document.getElementById('rr').style.setProperty('--pct',pct+'%');
  document.getElementById('rs').textContent=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('rt').textContent=pct>=90?'ممتاز! 🌟':pct>=70?'جيد جداً 👍':pct>=50?'مقبول':'لا تستسلم! 💪';
  document.getElementById('rb').textContent='القسم 92 — '+sc+'/'+T+' صحيحة';
  const dur=Math.round((Date.now()-(_st||Date.now()))/1000);
  document.getElementById('rv').textContent='⏱ الوقت: '+Math.floor(dur/60)+'د '+(dur%60)+'ث';
  const sm=document.getElementById('sm');
  if(_uid){sm.style.cssText='display:block;background:#1e1e32;color:#94a3b8;padding:.5rem .8rem;border-radius:10px;text-align:center;font-size:.85rem;margin:.5rem 0';sm.textContent='⏳ جارٍ حفظ نتيجتك...';_SB.from('results').insert([{user_id:_uid,subject:_subj,section_num:92,correct:sc,total:T,duration_sec:dur,score_pct:pct}]).then(r=>{if(!r.error){sm.textContent='✅ نتيجتك '+sc+'/'+T+' ('+pct+'%) حُفظت في حسابك';sm.style.background='#052e16';sm.style.color='#22c55e';}else{sm.textContent='❌ خطأ في الحفظ';sm.style.background='#2d0707';sm.style.color='#ef4444';}});}
  else{sm.textContent='⚠️ لم تُحفظ — سجّل دخولك أولاً';sm.style.cssText='display:block;background:#2a1e00;color:#f59e0b;padding:.5rem .8rem;border-radius:10px;text-align:center;font-size:.85rem;font-weight:700;margin:.5rem 0';}
  go('s2');rev('all');
}
function rev(f){
  ['all','ok','no'].forEach(x=>document.getElementById('t'+x).className='rtab'+(f===x?' act-'+x:''));
  const rl=document.getElementById('rl');rl.innerHTML='';
  const items=log.filter(e=>f==='all'||(f==='ok'&&e.ok)||(f==='no'&&!e.ok));
  if(!items.length){rl.innerHTML='<p style="text-align:center;color:var(--mt);padding:1rem">لا توجد أسئلة</p>';return;}
  items.forEach(e=>{
    const q=QS[e.q];const card=document.createElement('div');card.className='rev-card '+(e.ok?'is-ok':'is-no');
    const hdr=document.createElement('div');hdr.className='rev-hdr '+(e.ok?'ok':'no');hdr.textContent=(e.ok?'✅ صحيح':'❌ خاطئ')+' — السؤال '+(e.q+1);card.appendChild(hdr);
    const body=document.createElement('div');body.className='rev-body';
    if(q.img){const d=document.createElement('div');d.className='rev-img';d.innerHTML='<img src="'+q.img+'" alt=""/>';body.appendChild(d);}
    if(q.text){const p=document.createElement('div');p.className='rev-qt';p.textContent=q.text;body.appendChild(p);}
    const od=document.createElement('div');od.className='rev-opts';
    q.opts.forEach((o,i)=>{const s=document.createElement('span');s.className='rans'+(i===q.ans?' ok':i===e.ch&&!e.ok?' no':'');s.textContent=L[i];od.appendChild(s);});
    body.appendChild(od);card.appendChild(body);rl.appendChild(card);
  });
}
function rst(){c=0;sc=0;pk=false;log=[];go('s0');}
